<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand replayer — TCH Social Austin — PLO</title>
<style>
:root{
  --surface:#f7f6f2; --panel:#fffefb; --line:#e2dfd6;
  --ink:#151713; --ink-2:#5b5f57; --ink-3:#8e9188;
  --accent:#0f7a54; --blue:#2a78d6; --red:#c03434;
  --pos:#0f7a54; --neg:#c03434; --chip:#eef2ec;
  --felt:#e8efe7; --felt2:#dde8dc;
}
@media (prefers-color-scheme: dark){:root{
  --surface:#16191a; --panel:#1d2123; --line:#2c3134;
  --ink:#eceee9; --ink-2:#a8ada3; --ink-3:#767b73;
  --accent:#2fbf85; --blue:#3987e5; --red:#e66767;
  --pos:#2fbf85; --neg:#e66767; --chip:#252b28;
  --felt:#1c2622; --felt2:#182019;
}}
:root[data-theme="dark"]{
  --surface:#16191a; --panel:#1d2123; --line:#2c3134;
  --ink:#eceee9; --ink-2:#a8ada3; --ink-3:#767b73;
  --accent:#2fbf85; --blue:#3987e5; --red:#e66767;
  --pos:#2fbf85; --neg:#e66767; --chip:#252b28;
  --felt:#1c2622; --felt2:#182019;
}
:root[data-theme="light"]{
  --surface:#f7f6f2; --panel:#fffefb; --line:#e2dfd6;
  --ink:#151713; --ink-2:#5b5f57; --ink-3:#8e9188;
  --accent:#0f7a54; --blue:#2a78d6; --red:#c03434;
  --pos:#0f7a54; --neg:#c03434; --chip:#eef2ec;
  --felt:#e8efe7; --felt2:#dde8dc;
}
*{box-sizing:border-box}
body{background:var(--surface);color:var(--ink);margin:0;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Avenir Next Condensed","Arial Narrow",Impact,sans-serif;
  font-size:28px;font-weight:700;text-transform:uppercase;margin:0;
  letter-spacing:.02em}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.handnote{background:#1d2433;border-left:3px solid #6ea8fe;padding:8px 10px;
  margin:8px 0 0;border-radius:4px;line-height:1.45;max-width:900px;font-size:13px}
.ntag{display:inline-block;background:#2b3550;color:#9fc3ff;font-size:11px;
  padding:1px 6px;margin-left:6px;border-radius:9px}
.sub{color:var(--ink-2);margin:4px 0 14px;font-size:13.5px}
.sub a{color:var(--blue);text-decoration:none}

/* ---- stage (the screenshot area) ---- */
.stage{position:relative;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;aspect-ratio:16/10;
  min-height:430px;overflow:hidden;user-select:none}
.felt{position:absolute;left:11%;top:13%;width:78%;height:72%;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,var(--felt) 0%,var(--felt2) 78%);
  border:2px solid var(--line);
  box-shadow:inset 0 0 46px rgba(0,0,0,.10)}
.stamp{position:absolute;left:14px;top:10px;color:var(--ink-3);
  font-size:12.5px;font-weight:600;letter-spacing:.04em}
.stamp b{color:var(--ink-2)}
.badges{position:absolute;right:14px;top:10px;display:flex;gap:6px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);
  border:1px solid var(--accent);border-radius:4px;padding:1px 7px}
.badge.warn{color:var(--red);border-color:var(--red)}
.wordmark{position:absolute;right:14px;bottom:9px;color:var(--ink-3);
  font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase}

.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:7px}
.board{display:flex;gap:5px}
.board.split{align-items:center}
.board .runs{display:flex;flex-direction:column;gap:5px}
.board .lbl{align-self:center;color:var(--ink-3);font-size:10px;
  font-weight:700;letter-spacing:.08em;margin-right:2px}
.card{display:inline-block;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:0 5px;
  font:700 15px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace}
.board .card{font-size:21px;line-height:1.7;padding:1px 7px;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cs{color:var(--ink)}.ch{color:var(--red)}
.cd{color:var(--blue)}.cc{color:var(--accent)}
.card.back{background:var(--chip);color:var(--ink-3)}
.pot{background:var(--chip);border:1px solid var(--line);border-radius:14px;
  padding:2px 13px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.pot b{color:var(--ink)}
.potnote{font-size:10.5px;font-weight:600;color:var(--accent);
  letter-spacing:.02em}
.potnote.dimn{color:var(--ink-2)}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:20px;
  height:20px;border-radius:50%;background:var(--panel);
  border:1.5px solid var(--ink-2);color:var(--ink);
  font:800 11px/17px -apple-system,sans-serif;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.18)}

.seat{position:absolute;transform:translate(-50%,-50%);width:148px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:opacity .15s}
.seat.folded{opacity:.38}
.seat .cards{display:flex;gap:3px;min-height:26px}
.plate{background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:4px 10px 5px;text-align:center;min-width:118px;
  box-shadow:0 1px 4px rgba(0,0,0,.10)}
.seat.acting .plate{border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent),0 1px 4px rgba(0,0,0,.10)}
.seat.won .plate{border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(47,191,133,.35)}
.plate .nm{font-weight:700;font-size:13.5px;letter-spacing:.02em;
  white-space:nowrap}
.plate .nm .posn{color:var(--accent);font-size:10.5px;font-weight:700;
  margin-left:5px;letter-spacing:.06em}
/* blind/straddle posts stay legible for the whole hand, unlike the
   act pill, which the player's first real action overwrites */
.plate .nm .posn.post{color:var(--panel);background:var(--accent);
  border-radius:3px;padding:0 3px;letter-spacing:.04em}
.plate .stk{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.plate .hudln{font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.act{font-size:11px;font-weight:700;border-radius:9px;padding:0 8px;
  background:var(--chip);border:1px solid var(--line);color:var(--ink-2);
  white-space:nowrap}
.act.hot{color:var(--accent);border-color:var(--accent)}
.act.fold{color:var(--ink-3)}
.act.win{color:var(--pos);border-color:var(--pos)}
.bet{position:absolute;transform:translate(-50%,-50%);
  background:var(--panel);border:1px solid var(--accent);border-radius:11px;
  padding:0 9px;font-size:12px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.eqp{font-size:10.5px;font-weight:700;color:var(--accent)}

/* ---- controls (outside the stage) ---- */
.controls{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;
  align-items:center}
a.btn{text-decoration:none;font-weight:600;display:inline-block}
select,button,a.btn{background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;font:inherit;
  font-size:13.5px;padding:5px 10px}
button{cursor:pointer;font-weight:600}
button:hover,a.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
select{max-width:420px}
.streets{display:flex;gap:6px}
.streets button.on{border-color:var(--accent);color:var(--accent)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.expmsg{font-size:12.5px;color:var(--ink-2);margin-top:6px;min-height:1.2em}
.expmsg code{background:var(--chip);border-radius:4px;padding:1px 5px;
  font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.expmsg.err{color:var(--red)}
/* filmstrip cells: no rounding or border, so each slices out clean */
#film .filmcell{border:0;border-radius:0;margin:0;display:block}
.hint{color:var(--ink-3);font-size:12.5px;margin-top:8px}
/* ---- action editor (what-if sizing) ---- */
button.on{border-color:var(--accent);color:var(--accent)}
.editp{margin-top:12px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);padding:10px 12px;overflow-x:auto}
.editp .ehead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-bottom:8px;font-size:13px;color:var(--ink-2)}
.editp .ehead b{color:var(--ink)}
.editp table{border-collapse:collapse;width:100%;font-size:13px}
.editp td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}
.editp tr.cur td{background:var(--chip)}
.editp select,.editp input{font:inherit;font-size:13px;padding:3px 6px;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:5px}
.editp input{width:84px;font-variant-numeric:tabular-nums}
.editp input.bad{border-color:var(--red);color:var(--red)}
.editp td.hint2{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.editp td.hint2 .bad{color:var(--red)}
.editp button{padding:2px 8px;font-size:12.5px}
.editp .enote{color:var(--ink-3);font-size:11.5px;margin-top:6px}
/* phones: portrait table (vertical oval), compact plates, touch-size
   controls; tap left/right half of the stage to step */
@media(max-width:700px){
  .wrap{padding:12px 8px 40px}
  h1{font-size:22px}.sub{font-size:12px;margin:2px 0 10px}
  .stage{aspect-ratio:3/4.4;min-height:0}
  .felt{left:7%;top:9%;width:86%;height:80%}
  .stamp{font-size:10.5px;left:10px;top:7px}
  .badge{font-size:9px;padding:0 5px}
  .badges{right:10px;top:7px}
  .wordmark{font-size:9px;right:10px;bottom:6px}
  .stkspan{display:none}
  .center{max-width:62%}
  .potnote{max-width:190px;text-align:center}
  .seat{width:100px}
  .plate{min-width:82px;padding:3px 7px 4px;border-radius:6px}
  .plate .nm{font-size:11px}.plate .nm .posn{font-size:8.5px;margin-left:3px}
  .plate .stk{font-size:10px}.plate .hudln{font-size:8.5px}
  .card{font-size:11px;padding:0 3px;line-height:1.6}
  .board .card{font-size:15px;padding:1px 4px}
  .board{gap:3px}
  .seat .cards{gap:2px;min-height:19px}
  .act{font-size:9px;padding:0 6px}
  .bet{font-size:10px;padding:0 6px}
  .eqp{font-size:8.5px}
  .pot{font-size:11.5px;padding:1px 10px}
  .potnote{font-size:9px}
  .dbtn{width:16px;height:16px;font-size:9px;line-height:13px}
  .controls{gap:8px}
  select{flex:1 1 100%;max-width:none;padding:9px 10px}
  button{padding:9px 13px}
  input[type=range]{flex:1 1 100%}
  .expmsg{font-size:12.5px;color:var(--ink-2);margin-top:6px;min-height:1.2em}
.expmsg code{background:var(--chip);border-radius:4px;padding:1px 5px;
  font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.expmsg.err{color:var(--red)}
/* filmstrip cells: no rounding or border, so each slices out clean */
#film .filmcell{border:0;border-radius:0;margin:0;display:block}
.hint{font-size:11.5px}
}
</style>

/* ---- timeline: deal/event/end steps ---- */
function steps(h){
  const out=[{k:"deal",st:0}];
  const need={1:3,2:4,3:5};
  for(let st=0;st<=3;st++){
    if(st>0&&(h.board.length>=need[st]||h.events.some(e=>e[0]===st)))
      out.push({k:"deal",st});
    // straddle posts are table setup, not actions — seeded at the deal
    h.events.forEach(e=>{
      if(e[0]===st&&e[1]!=="straddle")out.push({k:"ev",st,e});});
  }
  const evMax=Math.max(0,...h.events.map(e=>e[0]));
  const bdSt=h.board.length>=5?3:h.board.length===4?2:
    h.board.length>=3?1:0;
  out.push({k:"end",st:Math.min(3,Math.max(evMax,bdSt))});
  return out;
}

/* the overlay never tags the button; preflop action order is
   UTG..BTN,SB,BB(,ST), so the actor whose first preflop event
   immediately precedes the SB's is the button */
/* The nameplate array IS the clockwise seat order (user-verified on
   #712: TONY,JAY,KARU,PANDA,PHIL,TY-SB,TROY-BB,ADAM-straddle) — the
   overlay slots run around the table. Roles come from array
   adjacency, poker structure: button = seat before the SB, straddler
   = seat after the BB. Position TAGS are what drift in straddled
   pots, so they only anchor SB/BB — never reorder the seats. */
function btnOf(h){
  if(h.bomb)return null;
  const bu=h.players.find(p=>p.pos==="BU"||p.pos==="BTN");
  if(bu)return bu.name;
  const n=h.players.length;
  const si=h.players.findIndex(p=>p.pos==="SB");
  return si>=0&&n>1?h.players[(si-1+n)%n].name:null;
}

/* pot odds on the action tags. A call shows the equity it needed: what it
   adds over the pot it would then win. A bet or raise shows the equity it
   asks of a caller who had matched the previous bet: the raise over that
   bet, against the pot after the wager plus the call. */
function oddsTxt(x){return ` · ${Math.round(100*x)}%`;}
function callOdds(pot,add){return add>0?oddsTxt(add/(pot+add)):"";}
function wagerOdds(pot,maxB,mine,to){
  const over=to-maxB;
  if(over<=0)return "";
  const after=pot+(to-mine);
  return oddsTxt(over/(after+over))+" to call";
}

/* state after step i: bets are per-street; call amts are increments,
   bet/raise/straddle/allin amts are street totals (see module doc) */
function state(h,S,i){
  const st={folded:{},bets:{},act:{},pot:0,street:0,actor:null,
            end:false,allin:{}};
  const commit={};
  let base=0;
  if(h.bomb){base=h.pot_first||0;}
  else{
    /* who posted what is settled in Python (blind_posts): the scanner
       never events the blinds, so tags name the poster where they
       exist and the seat ring supplies the rest. Posts are table
       setup, not actions — they seed the deal rather than joining the
       step list, so they show from step 0. */
    base=h.dead||0;
    (h.posts||[]).forEach(([nm,lbl,amt])=>{
      st.bets[nm]=(st.bets[nm]||0)+amt;
      st.act[nm]=[lbl+" "+fmt(amt),""];});
    if(h.dead)st.strayStraddle=true;
  }
  st.base=base;
  const newStreet=s=>{
    for(const n in st.bets)commit[n]=(commit[n]||0)+st.bets[n];
    st.bets={};st.act={};st.street=s;st.actor=null;
  };
  for(let j=1;j<=i&&j<S.length;j++){
    const s=S[j];
    if(s.k==="deal"){newStreet(s.st);continue;}
    if(s.k==="end"){
      newStreet(s.st);st.end=true;st.actor=null;
      for(const n in h.winners)st.act[n]=["wins "+sfmt(h.winners[n]),"win"];
      continue;
    }
    const[,kind,name,amt]=s.e;
    st.actor=name;
    // the pot and the price as this action meets them, for the odds tags
    let potB=base;
    for(const n in commit)potB+=commit[n];
    for(const n in st.bets)potB+=st.bets[n];
    const maxB=Math.max(0,...Object.values(st.bets)),mineB=st.bets[name]||0;
    if(kind==="fold"){st.folded[name]=1;st.act[name]=["folds","fold"];}
    else if(kind==="check")st.act[name]=["checks",""];
    else if(kind==="call"){
      // an edited call left blank calls the price (capped by the stack)
      let add=amt||0;
      if(amt==null&&h.edited){
        add=Math.max(0,Math.max(0,...Object.values(st.bets))-(st.bets[name]||0));
        const p=h.players.find(q=>q.name===name);
        if(p&&p.stack!=null)add=Math.min(add,Math.max(0,
          p.stack-(commit[name]||0)-(st.bets[name]||0)));
      }
      st.bets[name]=(st.bets[name]||0)+add;
      st.act[name]=["calls "+fmt(add)+callOdds(potB,add),"hot"];}
    else if(kind==="bet"){st.bets[name]=amt||0;
      st.act[name]=["bets "+fmt(amt||0)+wagerOdds(potB,maxB,mineB,amt||0),"hot"];}
    else if(kind==="raise"){st.bets[name]=amt||0;
      st.act[name]=["raises to "+fmt(amt||0)+wagerOdds(potB,maxB,mineB,amt||0),"hot"];}
    else if(kind==="allin"){st.bets[name]=amt||0;st.allin[name]=1;
      st.act[name]=["all-in "+fmt(amt||0)+((amt||0)>maxB?wagerOdds(potB,maxB,mineB,amt||0):
        callOdds(potB,Math.max(0,(amt||0)-mineB))),"hot"];}
  }
  let pot=base;
  for(const n in commit)pot+=commit[n];
  for(const n in st.bets)pot+=st.bets[n];
  st.pot=st.end&&h.pot?h.pot:pot;
  st.put={};
  h.players.forEach(p=>{
    st.put[p.name]=(commit[p.name]||0)+(st.bets[p.name]||0);});
  st.maxBet=Math.max(0,...Object.values(st.bets));
  return st;
}

function seatXY(k,n){
  // hero (JAY) bottom-center; successive seats go bottom→left→top→
  // right, which IS clockwise on screen (y grows downward) — dealing
  // order reads true. Portrait stages pull seats in horizontally so
  // the plates stay on-screen
  const t=k/n, a=Math.PI/2+t*2*Math.PI;
  return NARROW.matches?
    [50+33*Math.cos(a),50+38.5*Math.sin(a)]:
    [50+43.5*Math.cos(a),49+40*Math.sin(a)];

  let k=0;
  if(H.board2.length&&!H.bomb)
    while(k<Math.min(H.board.length,H.board2.length)&&
          H.board[k]===H.board2[k])k++;
  if(k>=3&&b1.length){
    const b2=pad(H.board2.slice(0,slots));
    const r1=b1.slice(k),r2=b2.slice(k);
    const cards=cs=>cs.map(c=>c?cardHTML(c,1):`<span class="card back">?</span>`).join("");
    boards+=`<div class="board split">${cards(b1.slice(0,k))}`+
      (r1.length||r2.length?`<div class="runs">`+
        `<div class="board">${cards(r1)}</div>`+
        `<div class="board">${cards(r2)}</div></div>`:"")+
      `</div>`;
  }else{
    if(b1.length)boards+=row(b1,H.board2.length?"TOP":"");
    if(H.board2.length){
      const b2=pad(H.board2.slice(0,slots));
      if(b2.length)boards+=row(b2,"BOT");
    }
  }
  // a post the scan never attributed (an off-camera straddle, or a
  // blind whose plate carried no position tag) is real money in the
  // pot that no seat can honestly wear — say so rather than pin it on
  // a guess. 32 hands as of 2026-08-30.
  let notes=st.strayStraddle&&!st.end&&st.street===0?
    `<div class="potnote">incl. ${fmt(H.dead)} posted · poster off-camera</div>`:"";
  // live SPR: effective (smallest live known) stack over the pot
  if(!st.end&&st.street>0&&st.pot>0){
    const live=H.players.filter(p=>!st.folded[p.name]&&p.stack!=null)
      .map(p=>p.stack-st.put[p.name]);
    if(live.length>=2){
      const spr=Math.min(...live)/st.pot;
      notes+=`<div class="potnote dimn">SPR ${spr.toFixed(1)}</div>`;
    }
  }
  // pot odds for whoever the next step has facing a bet
  const nx=S[I+1];
  if(nx&&nx.k==="ev"&&["call","fold","raise","allin"].includes(nx.e[1])){
    const who=nx.e[2],toCall=st.maxBet-(st.bets[who]||0);
    if(toCall>0)notes+=`<div class="potnote dimn">${who} to call `+
      `${fmt(toCall)} · needs ${Math.round(100*toCall/(st.pot+toCall))}%</div>`;
  }
  html+=`<div class="center">${boards}`+
    `<div class="pot">POT <b>${fmt(st.pot)}</b></div>${notes}</div>`;
  // seats in nameplate (= clockwise) order, hero at bottom
  const btn=btnOf(H);
  // posted roles outrank the scanned position tag on the plate: they
  // are what the seat actually did before the deal
  const role={};
  (H.posts||[]).forEach(([nm,lbl])=>{if(!role[nm])role[nm]=lbl;});
  const ps=H.players.slice();
  const hero=ps.findIndex(p=>p.name==="JAY");
  const ord=hero>=0?ps.slice(hero).concat(ps.slice(0,hero)):ps;
  ord.forEach((p,k)=>{
    const [x,y]=seatXY(k,ord.length);
    const folded=st.folded[p.name];
    const won=st.end&&(p.name in H.winners);
    const acting=st.actor===p.name;
    const a=st.act[p.name];
    const s=STATS[p.name];
    const eqv=eq&&eq[p.name]!=null&&!folded?
      `<span class="eqp">${Math.round(eq[p.name]*100)}%</span>`:"";
    const cards=(p.cards||[]).map(c=>cardHTML(c)).join("");
    const netln=st.end&&p.net?` · ${sfmt(p.net)}`:"";
    const liveStk=p.stack==null?null:
      st.end&&!H.edited?p.stack+(p.net||0):p.stack-st.put[p.name];
    html+=`<div class="seat${folded?" folded":""}${acting?" acting":""}`+
      `${won?" won":""}" style="left:${x}%;top:${y}%">`+
      `<div class="cards">${cards}</div>`+
      `<div class="plate"><div class="nm">${p.name}`+
      `${role[p.name]?`<span class="posn post">${role[p.name]}</span>`:
        p.pos?`<span class="posn">${p.pos}</span>`:""} ${eqv}</div>`+
      `<div class="stk">${liveStk!=null?fmt(Math.max(0,liveStk)):"—"}${netln}</div>`+
      (s?`<div class="hudln">${Math.round(s.vpip)}/${Math.round(s.pfr)}`+
         ` · ${s.hands}h</div>`:"")+
      `</div>`+
      (a?`<div style="margin-top:1px"><span class="act ${a[1]}">${a[0]}</span></div>`:"")+
      `</div>`;
    if(st.bets[p.name]){
      const [bx,by]=betXY(x,y);
      html+=`<div class="bet" style="left:${bx}%;top:${by}%">`+
        `${fmt(st.bets[p.name])}</div>`;
    }
    if(p.name===btn){
      // dealer disc sits beside the bet-pill spot, nudged tangentially
      const [bx,by]=betXY(x,y);
      const vx=x-50,vy=y-47,L=Math.hypot(vx,vy)||1;
      html+=`<div class="dbtn" style="left:${bx-vy/L*5.5}%;`+
        `top:${by+vx/L*5.5}%">D</div>`;
    }
  });
  html+=`<div class="wordmark">pokerhud</div>`;
  return html;
}

/* Export: the page cannot run Chrome or ffmpeg, so the button asks the
   local helper (tools/export_server.py) to render with the very same
   pipeline the command line uses, then saves the file where you choose.
   Falls back to a normal download when the browser has no file picker. */
const EXPORT_HOST="http://127.0.0.1:8777";
async function exportHand(fmt){
  const b=document.getElementById("exp"), msg=document.getElementById("expmsg");
  const no=H.no, label=b.textContent;
  b.disabled=true; msg.className="expmsg";
  const name=`hand${no}.${fmt}`;
  try{
    let blob=null;
    // a pre-rendered file ships with the site, so anyone can export
    // without running anything; the local helper is the fallback for
    // hands not yet rendered (and for GIFs, which are not shipped)
    if(fmt==="mp4"){
      msg.textContent="fetching…";
      try{
        const pre=await fetch(`mp4/hand${no}.mp4`,{cache:"force-cache"});
        if(pre.ok&&(pre.headers.get("content-type")||"").includes("video"))
          blob=await pre.blob();
      }catch(e){}
    }
    if(!blob){
      msg.textContent=`rendering hand #${no} — about 30 seconds the first `+
        `time, instant after that`;
      const r=await fetch(`${EXPORT_HOST}/export?hand=${no}&fmt=${fmt}`);
      if(!r.ok)throw new Error(await r.text()||r.status);
      blob=await r.blob();
    }
    if(window.showSaveFilePicker){
      let h;
      try{
        h=await window.showSaveFilePicker({suggestedName:name,types:[{
          description:fmt.toUpperCase(),
          accept:{[fmt==="mp4"?"video/mp4":"image/gif"]:["."+fmt]}}]});
      }catch(e){ msg.textContent=""; return; }   // the user cancelled
      const w=await h.createWritable();
      await w.write(blob); await w.close();
      msg.textContent=`saved ${name} (${Math.round(blob.size/1024)}KB)`;
    }else{
      const u=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=u; a.download=name; a.click();
      setTimeout(()=>URL.revokeObjectURL(u),10000);
      msg.textContent=`downloaded ${name} (${Math.round(blob.size/1024)}KB)`;
    }
  }catch(e){
    msg.className="expmsg err";
    msg.innerHTML=`no pre-rendered file for this hand yet, and the local `+
      `helper isn't running — start it with `+
      `<code>.venv/bin/python tools/export_server.py</code>`;
  }finally{ b.disabled=false; b.textContent=label; }
}

/* ---- action editor: a what-if copy of the hand ----
   Edit opens the hand's actions as rows; any change rebuilds the steps
   and re-renders, so the pot, the pot-odds note and SPR on the table
   follow. Edits live in this page only (reload or Reset to undo) and
   the result is not recomputed: the edited copy has no winners. */
const EDIT={};
let EDITING=false;
const KINDS=["fold","check","call","bet","raise","allin"];
function editCopy(no){
  if(!EDIT[no]){
    const c=JSON.parse(JSON.stringify(byNo[no]));
    c.edited=true;c.winners={};c.pot=null;
    c.players.forEach(p=>p.net=null);
    EDIT[no]=c;
  }
  return EDIT[no];
}
function reStep(){S=steps(H);I=Math.min(I,S.length-1);}
function stepOf(e){return S.findIndex(s=>s.k==="ev"&&s.e===e);}
function editHTML(){
  const names=H.players.map(p=>p.name);
  const rows=H.events.map((e,k)=>{
    if(e[1]==="straddle")return "";
    const j=stepOf(e);
    const pre=j>0?state(H,S,j-1):null;
    let hint="";
    if(pre){
      const toCall=Math.max(0,pre.maxBet-(pre.bets[e[2]]||0));
      const max=pre.maxBet+pre.pot+toCall;     // pot-limit raise-to
      const parts=[`pot ${fmt(pre.pot)}`];
      if(toCall>0)parts.push(`to call ${fmt(toCall)} · needs `+
        `${Math.round(100*toCall/(pre.pot+toCall))}%`);
      if(["bet","raise","allin"].includes(e[1])&&e[3]!=null&&e[3]>pre.maxBet){
        const w=wagerOdds(pre.pot,pre.maxBet,pre.bets[e[2]]||0,e[3]);
        parts.push(`caller needs${w.replace(" · "," ").replace(" to call","")}`);
      }
      if(["bet","raise","allin"].includes(e[1])){
        const over=e[3]!=null&&e[3]>max;
        parts.push(`<span class="${over?"bad":""}">PL max to ${fmt(max)}</span>`);
      }
      hint=parts.join(" · ");
    }
    const amtLbl=e[1]==="call"?"adds":["bet","raise","allin"].includes(e[1])?"to":"";
    const amt=amtLbl?`<input type="number" min="0" step="5" data-k="${k}" data-f="amt"`+
      ` value="${e[3]??""}" placeholder="${e[1]==="call"?"price":""}">`:"";
    return `<tr class="${j===I?"cur":""}">`+
      `<td><button data-k="${k}" data-do="go" title="show the table at this action">▶</button></td>`+
      `<td><select data-k="${k}" data-f="st">${STREETS.map((n,i)=>
        `<option value="${i}"${i===e[0]?" selected":""}>${n}</option>`).join("")}</select></td>`+
      `<td><select data-k="${k}" data-f="name">${names.map(n=>
        `<option${n===e[2]?" selected":""}>${n}</option>`).join("")}</select></td>`+
      `<td><select data-k="${k}" data-f="kind">${KINDS.map(n=>
        `<option${n===e[1]?" selected":""}>${n}</option>`).join("")}</select></td>`+
      `<td style="white-space:nowrap">${amtLbl?`<span style="color:var(--ink-3);font-size:11.5px">${amtLbl}</span> `:""}${amt}</td>`+
      `<td class="hint2">${hint}</td>`+
      `<td style="white-space:nowrap"><button data-k="${k}" data-do="ins" title="insert an action after this one">＋</button> `+
      `<button data-k="${k}" data-do="del" title="delete this action">✕</button></td></tr>`;
  }).join("");
  return `<div class="ehead"><b>Edit hand #${H.no}</b>`+
    `<span>${H.edited?"what-if copy — the table shows your version":"original"}</span>`+
    `<span style="flex:1"></span>`+
    `<button data-do="add">＋ add action</button>`+
    `<button data-do="reset"${H.edited?"":" disabled"}>↺ reset to original</button>`+
    `<button data-do="close">done</button></div>`+
    `<table>${rows}</table>`+
    `<div class="enote">Amounts: a call is what it adds (leave it blank to call the price); `+
    `a bet, raise or all-in is the street total it makes. Rows run in action order — `+
    `＋ inserts after a row. Blinds and straddles stay as posted. Edits stay in this page `+
    `until you reload or reset; the result isn't recomputed.</div>`;
}
function renderEdit(){
  const ep=document.getElementById("editp");
  ep.hidden=!EDITING;
  document.getElementById("edit").classList.toggle("on",EDITING);
  document.getElementById("exp").disabled=!!H.edited;
  if(!EDITING)return;

document.getElementById("editp").addEventListener("change",ev=>{
  const t=ev.target,k=+t.dataset.k,f=t.dataset.f;
  if(!f)return;
  H=editCopy(H.no);
  const e=H.events[k];
  if(f==="st")e[0]=+t.value;
  else if(f==="name")e[2]=t.value;
  else if(f==="kind"){e[1]=t.value;
    if(["fold","check"].includes(e[1]))e[3]=null;}
  else if(f==="amt")e[3]=t.value===""?null:Math.max(0,+t.value);
  // keep the street order: steps() groups by street, rows follow it
  H.events.sort((a,b)=>a[0]-b[0]);
  reStep();sync();
});
document.getElementById("editp").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const d=b.dataset.do,k=+b.dataset.k;
  if(d==="close"){EDITING=false;sync();return;}
  if(d==="reset"){delete EDIT[H.no];H=byNo[H.no];reStep();sync();return;}
  if(d==="go"){const j=stepOf(H.events[k]);if(j>=0){I=j;sync();}return;}
  H=editCopy(H.no);
  if(d==="del")H.events.splice(k,1);
  if(d==="ins"){const e=H.events[k];
    H.events.splice(k+1,0,[e[0],"call",e[2],null]);}
  if(d==="add"){const last=H.events[H.events.length-1];
    H.events.push([last?last[0]:0,"check",H.players[0].name,null]);}
  reStep();
  if(d!=="del"){const j=stepOf(H.events[d==="add"?H.events.length-1:k+1]);if(j>=0)I=j;}
  sync();
});
document.getElementById("edit").onclick=()=>{EDITING=!EDITING;sync();};

function sync(){render();renderEdit();}
function setHand(no,a){
  H=EDIT[no]||byNo[no]||HANDS[HANDS.length-1];S=steps(H);

/* the equity calculator, loaded with this step: the board dealt so far
 * and everyone still in. A player whose cards the stream never showed
 * goes in as an unknown hand (Xx wildcards); a run-it-twice hand opens
 * both boards, anything else single-board */
const CALC="https://mrjayis.github.io/plo-dbbp-equity-calculator/";
function calcLink(h,st){
  const ncards=(h.players.find(p=>p.cards)||{cards:[1,2,3,4]}).cards.length;
  const live=h.players.filter(p=>!st.folded[p.name]);
  const seats=[],rs=[];
  live.forEach((p,k)=>{
    if(p.cards&&p.cards.length===ncards)seats.push(p.cards.join(""));
    else{seats.push("-");rs.push(`r${k+1}=`+encodeURIComponent(Array(ncards).fill("Xx").join(" ")));}
  });
  const upto={0:0,1:3,2:4,3:5}[st.street]??0;
  const slots=st.end?5:upto;
  const a=h.board.slice(0,slots),b=h.board2.slice(0,slots);
  // the calculator deals two separate boards, so only a preflop
  // run-it-twice (no card shared) loads as one; a rerun that shares its
  // flop opens on the first runout
  const two=b.length>0&&!b.some(c=>a.includes(c));
  const names=live.map(p=>encodeURIComponent(p.name.replace(/,/g," "))).join(",");
  return CALC+`#cards=${ncards}&n=${live.length}&seats=${seats.join(",")}&names=${names}`+
    (rs.length?"&"+rs.join("&"):"")+
    `&a=${a.join("")}`+(two?`&b=${b.join("")}`:"&sb=1")+"&run=1";
}
/* player filter: the hands a player took to the flop. Seen postflop
 * means the flop was dealt, they did not fold preflop, and something
 * puts them past it -- an action on a later street, a win, a preflop
 * all-in, or a bomb pot (no preflop) -- so a preflop fold the scan
 * missed does not count as seeing a flop */
function sawFlop(h,name){
  if(h.board.length<3||!h.players.some(p=>p.name===name))return false;
  let post=false,allin=false;
  for(const[st,kind,nm]of h.events){
    if(nm!==name)continue;
    if(st===0){if(kind==="fold")return false;if(kind==="allin")allin=true;}
    else post=true;
  }
  return post||allin||name in h.winners||!!h.bomb;
}
let WHO="",LIST=HANDS;
const who=document.getElementById("who");
{
  const cnt={};
  HANDS.forEach(h=>h.players.forEach(p=>{
    if(sawFlop(h,p.name))cnt[p.name]=(cnt[p.name]||0)+1;}));
  who.innerHTML=`<option value="">All hands (${HANDS.length})</option>`+
    Object.keys(cnt).sort().map(n=>`<option value="${n.replace(/"/g,"&quot;")}">${n} · ${cnt[n]} postflop</option>`).join("");
}

/* deep link (and react to hash edits / shared-link navigation) */
/* #h=<no>&film=1 lays every step out in a column at a fixed width, so
   the exporter can screenshot a hand once and slice the frames out
   rather than launching a browser per step (28s -> ~3s a hand). Purely
   a rendering path: nothing about the normal replayer changes. */
function filmstrip(no,w,from,n){
  const h=byNo[no]; if(!h)return;
  const S=steps(h);
  const cells=S.map((_,i)=>i).slice(from||0,
    n?((from||0)+n):undefined);
  document.title=`film ${no} ${S.length} ${w}`;
  document.body.innerHTML=
    `<div id="film" style="width:${w}px">`+
    cells.map(i=>`<div class="stage filmcell">${stageHTML(h,S,i)}</div>`)
      .join("")+`</div>`;
  document.body.style.cssText=
    "margin:0;padding:0;background:var(--panel)";
}

function fromHash(){
  const f=location.hash.match(/h=(\d+).*?[&?]film=1/);
  if(f){
    const g=k=>{const m=location.hash.match(new RegExp("[&?]"+k+"=(\\d+)"));
      return m?+m[1]:null;};
    return filmstrip(+f[1],g("w")||968,g("from")||0,g("n"));
  }
  const pm=location.hash.match(/[#&]p=([^&]+)/);
  const pn=pm?decodeURIComponent(pm[1]):"";
  if(pn!==WHO)setWho(pn);
  const m=location.hash.match(/h=(\d+)(?:&a=(\d+))?/);
  setHand(m?+m[1]:LIST[LIST.length-1].no,m&&m[2]?+m[2]:0);
}
window.addEventListener("hashchange",()=>{
  const m=location.hash.match(/h=(\d+)(?:&a=(\d+))?/);
  const pm=location.hash.match(/[#&]p=([^&]+)/);
  if(!m||+m[1]!==H.no||+(m[2]||0)!==I||(pm?decodeURIComponent(pm[1]):"")!==WHO)fromHash();
