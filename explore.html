<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand search</title>
<style>
:root{--surface:#f7f6f2;--panel:#fffefb;--line:#e2dfd6;--ink:#151713;
  --ink-2:#5b5f57;--ink-3:#8e9188;--accent:#0f7a54;--red:#c03434;
  --blue:#2a78d6;--chip:#eef2ec}
@media (prefers-color-scheme:dark){:root{--surface:#16191a;--panel:#1d2123;
  --line:#2c3134;--ink:#eceee9;--ink-2:#a8ada3;--ink-3:#767b73;
  --accent:#2fbf85;--red:#e66767;--blue:#3987e5;--chip:#252b28}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Avenir Next Condensed","Arial Narrow",Impact,sans-serif;
  font-size:28px;text-transform:uppercase;margin:0 0 2px;letter-spacing:.02em}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase}
.sub{color:var(--ink-2);font-size:13.5px;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
select,input,button{font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:6px 9px}
button{cursor:pointer}
button.go{background:var(--accent);color:#fff;border-color:var(--accent);
  font-weight:600}
button.x{padding:4px 9px;color:var(--ink-3)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin:10px 0 6px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px 11px;
  font-size:13px;cursor:pointer;background:var(--surface);user-select:none}
.tag.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);border-bottom:1px solid var(--line);padding:6px 8px}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.hd{cursor:pointer}
tr.hd:hover{background:var(--chip)}
.cards{white-space:nowrap;font-weight:700}
.cs{color:var(--ink)}.ch{color:var(--red)}
.cd{color:var(--blue)}.cc{color:var(--accent)}
.mono .cs,.mono .ch,.mono .cd,.mono .cc{font-weight:700}
.handnote{background:#1d2433;border-left:3px solid #6ea8fe;
  padding:8px 10px;margin:0 0 8px;border-radius:4px;line-height:1.45}
.ntag{display:inline-block;background:#2b3550;color:#9fc3ff;font-size:11px;
  padding:1px 6px;margin-left:6px;border-radius:9px}
.mono{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap;color:var(--ink-2);background:var(--chip);
  border-radius:6px;padding:10px 12px;margin:0}
a{color:var(--accent)}
.note{color:var(--ink-3);font-size:12.5px;margin-top:6px}
.empty{color:var(--ink-3);padding:18px 4px}
</style>

    <button id="clear">Reset</button>
    <span class="count" id="count"></span>

</div>

function explainOf(code){

  if(code==="aces")return "two or more aces among his hole cards.";
  if(code==="blind")return "in the small blind, big blind or third blind.";
  if(code==="vpip")return "called, raised or bet preflop by choice; posting a blind or straddle does not count.";
  if(code==="suit3")return "three or four of his hole cards share a suit: the extra suited cards are dead to his own flush.";
  if(code==="pfa")return "preflop aggressor = the last player to raise preflop; a limped pot has none.";
  if(code==="3bet")return "3-bet = the second raise preflop.";
  if(code==="firstin"||code==="open"||code==="limp"||code==="foldfirst")
    return "first in = acted with no raise and no caller ahead; the blinds and a straddle are never first in.";
  if(code==="vsopen"||code==="coldcall"||code==="foldopen")
    return "faced an open = acted after the first raise and before any re-raise.";
  if(code==="vs3bet"||code==="call3b"||code==="4bet"||code==="f3b")
    return "was 3-bet = the opener's first action after the second raise.";
  const c=code.slice(-1), st={f:"flop",t:"turn",r:"river"}[c];
  if(!st)return "";
  if(code.startsWith("cb")&&code.length===3)
    return `continuation bet = whoever held the betting lead makes the ${st}'s first wager (a checked street carries the lead, so a delayed one counts).`;
  if(code.startsWith("cbfaced"))return `faced the ${st} continuation bet.`;
  if(code.startsWith("cbfold")||code.startsWith("cbcall")||code.startsWith("cbraise"))
    return `answered the ${st} continuation bet; attribution stops at the first raise, since what follows answers the RAISE.`;
  if(code.startsWith("donk"))return `donk bet = he faced a wager on the street BEFORE the ${st}, and opened the ${st} betting before that aggressor could act.`;
  if(code.startsWith("probe"))return `probe bet = the street before the ${st} checked through, so there was no aggressor to lead into; he opened the ${st} betting and is not the preflop raiser (whose bet there would be a delayed continuation bet).`;
  if(code.startsWith("ctlast"))return `checked to with nobody left behind him: everyone else with action on the ${st} had already checked, so his check checks it through.`;
  if(code.startsWith("ct"))return `checked to = nobody had wagered on the ${st} yet and at least one player checked ahead of him when he first acted (first to act is not checked to). Add "was checked to last" with "not" for the spots where someone still acts behind him.`;
  if(code.startsWith("air")||code.startsWith("pair")||code.startsWith("strong"))
    return `hand class on the ${st}, from his own cards and the board as it stood: air = nothing made and under 8 outs; one pair = exactly one pair (top pair and overpairs included) with no big draw -- in Omaha a bluff-catcher at best; two pair or better = made with his own cards. A big draw is its own filter.`;
  if(code.startsWith("weak"))return `one pair or worse on the ${st} (air, or exactly one pair with no big draw): the notes' bluff definition. Overpairs count as one pair, so check the hands before calling a bet a bluff.`;
  if(code.startsWith("mon"))return `a set or better on the ${st}: set, straight, flush, full house, quads.`;
  if(code.startsWith("drawonly"))return `8+ outs to a straight or flush on the ${st} with nothing made yet -- the deep reads' draw class. "Had a big draw" also counts made hands with 8+ outs.`;
  if(code.startsWith("first"))return `the first player to act on the ${st}.`;
  if(code.startsWith("rz"))return `made any raise on the ${st}, re-raises included -- not just an answer to the first wager.`;
  if(code.startsWith("betmid"))return `made the ${st}'s first wager as a bet of 50-80% of the pot as the ${st} began -- between the small and big brackets.`;
  if(code.startsWith("betsz"))return `made the ${st}'s first wager as a plain bet whose size against the pot is known (the chances for the sizing filters).`;
  if(code.startsWith("facedsm")||code.startsWith("facedbig"))
    return `answered the ${st}'s first wager when it was a bet of ${code.startsWith("facedsm")?"under half":"80% or more of"} the pot.`;
  if(code.startsWith("bvr"))return `made the ${st}'s first wager, someone raised, and this is what he did next.`;
  if(code.startsWith("betsm")||code.startsWith("betbig"))
    return `made the ${st}'s first wager as a bet of ${code.startsWith("betsm")?"under half":"80% or more of"} the pot as the ${st} began.`;
  if(code.startsWith("xr"))return `checked and then raised on the ${st}.`;
  if(code.startsWith("bet"))return `made the ${st}'s first wager, continuation bet or not.`;
  if(code.startsWith("faced")||code.startsWith("fold")||code.startsWith("call")||code.startsWith("raise"))
    return `answered the ${st}'s first wager, whoever made it.`;
  if(code.startsWith("lead"))return `held the betting lead going into the ${st}.`;
  if(code.startsWith("aggb"))return `when he first acted on the ${st}, the player holding the betting lead (the last aggressor, carried through checked streets) was still to act behind him -- so his check was a check to the raiser, not a slowplay.`;
  if(code.startsWith("hit")||code.startsWith("miss"))
    return `he held a big draw on the previous street and it ${code.startsWith("hit")?"came in":"did not"} on the ${st} -- the split that separates a player slow-playing the hand he got from one giving up on the one he missed.`;
  if(code.startsWith("draw"))
    return `8 or more outs to a straight or flush on the ${st} (cards that fill up a set or two pair count only when a straight or flush is already possible on the board), counted over every unseen card as the player himself could count them -- he cannot see which of his outs sit in another hand. A semi-bluff, which "worst hand" hides: a wrap ranks bottom on made strength while often being the equity favourite.`;
  if(code.startsWith("best")||code.startsWith("worst"))

  if(!pos.length)return null;
  let who=[...(h.acts[pos[0].c]||[])];
  for(const r of pos.slice(1))who=who.filter(n=>(h.acts[r.c]||[]).includes(n));
  for(const r of neg)who=who.filter(n=>!(h.acts[r.c]||[]).includes(n));
  return who;
}
function match(h){
  if(only&&!only.has(h.no))return false;
  for(const r of rules){
    const who=h.acts[r.c]||[];
    if(!r.p&&anyoneWho(h)!==null)continue;   // judged together below
    const has=r.p?who.includes(r.p):who.length>0;
    if(r.n?has:!has)return false;
  }
  const aw=anyoneWho(h);
  if(aw!==null&&!aw.length)return false;
  for(const t of tex)if(!(h.tags||[]).includes(t))return false;
  for(const m of misc){
    if(m==="bomb"||m==="rit"||m==="sd"){if(!h[m])return false;}
    else if(m==="straddle"){if(!h.straddle)return false;}
    else if(!(h.tags||[]).includes(m))return false;
  }
  const st=document.getElementById("stakes").value;
  if(st&&h.stakes!==st)return false;
  const vd=document.getElementById("video").value;
  if(vd&&h.src!==vd)return false;
  return true;
}
function run(){
  writeHash();
  const out=HANDS.filter(match);
  document.getElementById("count").textContent=
    `${out.length} hand${out.length===1?"":"s"}`;
  const R=document.getElementById("results");
  const cited=only?`<div class="note" style="margin:0 0 8px">Showing the ${only.size} hands the leak finder cited for these conditions. <a href="#" id="allm">Show every hand that matches</a></div>`:"";
  if(!out.length){R.innerHTML=cited+`<div class="empty">No hands match.</div>`;bindAll();return;}
  const showWho=rules.some(r=>!r.p&&!r.n);
  R.innerHTML=cited+`<table><thead><tr><th>Hand</th>${showWho?"<th>Who</th>":""}<th>Stakes</th><th>Board</th>
    <th>Pot</th><th>Video</th><th></th></tr></thead><tbody>`+
    out.map(h=>`<tr class="hd" data-no="${h.no}">
      <td><b>#${h.no}</b></td>${showWho?`<td>${(anyoneWho(h)||[]).join(", ")}</td>`:""}<td>${h.stakes||""}</td>
      <td class="cards">${(h.board||[]).map(card).join(" ")}</td>
      <td>${h.pot?"$"+h.pot.toLocaleString():""}</td>
      <td>${TITLES[h.src]||""}</td>
      <td><a href="replayer.html#h=${h.no}" target="_blank">replay ↗</a></td>
    </tr><tr id="d${h.no}" style="display:none"><td colspan="6">
      ${(NOTES[h.no]||[]).map(n=>`<div class="handnote"><b>${n.who}</b>${
        n.tags.map(t=>`<span class="ntag">${t}</span>`).join("")}<br>${n.text}</div>`).join("")}
      <pre class="mono">${histHTML(h.hist)}</pre>
      ${h.vurl?`<div class="note"><a target="_blank" href="${h.vurl}">watch on ${VNAME} ↗</a></div>`:h.yt?`<div class="note"><a target="_blank" href="https://www.youtube.com/watch?v=${h.yt}&t=${Math.floor(h.t||0)}s">watch on YouTube ↗</a></div>`:""}
    </td></tr>`).join("")+`</tbody></table>`.replace(/colspan="6"/g,`colspan="${showWho?7:6}"`);
  R.querySelectorAll("tr.hd").forEach(tr=>tr.onclick=()=>{
    const d=document.getElementById("d"+tr.dataset.no);
    d.style.display=d.style.display==="none"?"table-row":"none";});
  bindAll();
}
function bindAll(){
  const a=document.getElementById("allm");
  if(a)a.onclick=e=>{e.preventDefault();only=null;run();};
}
function init(){
  const sel=document.getElementById("stakes");
  sel.innerHTML=`<option value="">any stakes</option>`+
    [...new Set(HANDS.map(h=>h.stakes).filter(Boolean))].sort()
      .map(s=>`<option>${s}</option>`).join("");
  const v=document.getElementById("video");
  v.innerHTML=`<option value="">any video</option>`+
    [...new Set(HANDS.map(h=>h.src).filter(Boolean))].sort()
      .map(s=>`<option value="${s}">${s.slice(0,30)}</option>`).join("");
  readHash();
  drawRules();
  chips(document.getElementById("tex"),TEX,tex);
  chips(document.getElementById("misc"),MISC,misc);
  chips(document.getElementById("field"),FIELD,misc);
  chips(document.getElementById("notes"),NOTETAGS,misc);
  explain();
  document.getElementById("add").onclick=()=>{rules.push({p:"",c:"in",n:false});drawRules();};
  document.getElementById("go").onclick=run;
  document.getElementById("clear").onclick=()=>{
    rules=[];tex.clear();misc.clear();only=null;
    document.getElementById("stakes").value="";
    document.getElementById("video").value="";
    drawRules();chips(document.getElementById("tex"),TEX,tex);
    chips(document.getElementById("misc"),MISC,misc);
    chips(document.getElementById("field"),FIELD,misc);
    chips(document.getElementById("notes"),NOTETAGS,misc);explain();run();};
  run();
  loadNotes(function(d){
    const box=document.getElementById("notes");
    if(!d){box.innerHTML='<span class="tag" id="setkey">🔒 notes locked'+
      ' — click to enter key</span>';
      document.getElementById("setkey").onclick=askNoteKey;return;}
    NOTES=d.hands||{};
    NOTETAGS=[["noted","has a hand note"]].concat(
      Object.entries(d.tags||{}).map(([t,l])=>["note:"+t,l]));
    for(const h of HANDS){
      const ns=NOTES[h.no];
      if(!ns)continue;
      h.tags=(h.tags||[]).concat(["noted"],
        [...new Set(ns.flatMap(n=>n.tags))].map(t=>"note:"+t));
    }
    chips(box,NOTETAGS,misc);
    run();
  });
}
init();
</script>
